<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đinh Trường</title>
    
    <!-- Favicon (Icon trên tab trình duyệt) -->
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/295/295118.png">
    <!-- Liên kết tới file Manifest -->
    <link rel="manifest" href="./manifest.json">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#2c3e50">
    
    <style>
        body, html {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background-color: #f5f6fa;
        }

        .menu-btn {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 1000;
            background-color: #2c3e50;
            color: white;
            border: none;
            border-radius: 8px;
            width: 45px;
            height: 45px;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }

        .sidebar.open ~ .menu-btn {
            background-color: #e74c3c;
        }

        .sidebar {
            width: 0; 
            background-color: #2c3e50;
            color: #ecf0f1;
            display: flex;
            flex-direction: column;
            transition: width 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
            overflow: hidden; 
            white-space: nowrap; 
            position: absolute;
            height: 100%;
            left: 0;
            top: 0;
            z-index: 900;
            box-shadow: 3px 0 10px rgba(0,0,0,0.3);
        }

        .sidebar.open {
            width: 280px;
        }

        .sidebar-header {
            padding: 80px 20px 20px 20px;
            background-color: #1a252f;
            text-align: left;
            font-weight: bold;
            font-size: 20px;
            border-bottom: 1px solid #34495e;
        }

        .web-list {
            list-style: none;
            padding: 0;
            margin: 0;
            overflow-y: auto;
            flex-grow: 1;
        }

        .web-list li {
            padding: 16px 20px;
            border-bottom: 1px solid #34495e;
            cursor: pointer;
            font-size: 16px;
        }
        
        .web-list li:hover {
            background-color: #34495e;
        }

        .web-list li.active {
            background-color: #3498db;
            color: white;
            font-weight: bold;
            border-left: 4px solid #f1c40f;
        }

        .content {
            flex-grow: 1;
            width: 100%;
            height: 100%;
            display: flex;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background-color: #ffffff;
        }

        .placeholder-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #7f8c8d;
            font-size: 18px;
            z-index: 10;
            text-align: center;
            pointer-events: none;
        }

        /* ================= NÚT TẢI XUỐNG ỨNG DỤNG ================= */
        #installAppBtn {
            display: none; 
            position: fixed;
            bottom: 30px;
            right: 30px;
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer;
            z-index: 1000;
            transition: transform 0.3s;
        }
        #installAppBtn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="sidebar open" id="sidebar">
        <div class="sidebar-header">Danh Mục Ứng Dụng</div>
        <div id="loading" style="padding: 20px;">Đang kết nối...</div>
        <ul class="web-list" id="webList"></ul>
    </div>

    <div class="content">
        <button id="menuBtn" class="menu-btn">✕</button>
        <div id="placeholderText" class="placeholder-text">Vui lòng chọn ứng dụng</div>
        <iframe id="webFrame" src="about:blank" title="Giao diện Web"></iframe>
    </div>

    <!-- Nút Tải Ứng Dụng -->
    <button id="installAppBtn">📥 Cài Đặt Ứng Dụng</button>

    <script>
        // ================= ĐĂNG KÝ SERVICE WORKER =================
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('./sw.js').then(function(registration) {
                    console.log('ServiceWorker đăng ký thành công');
                }).catch(function(err) {
                    console.log('ServiceWorker đăng ký thất bại:', err);
                });
            });
        }

        // ================= XỬ LÝ NÚT TẢI XUỐNG (PWA) =================
        let deferredPrompt;
        const installBtn = document.getElementById('installAppBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'block';
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt !== null) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    console.log('Người dùng đã cài đặt ứng dụng');
                }
                deferredPrompt = null;
                installBtn.style.display = 'none';
            }
        });

        window.addEventListener('appinstalled', () => {
            installBtn.style.display = 'none';
        });


        // ================= XỬ LÝ GIAO DIỆN & API =================
        const menuBtn = document.getElementById('menuBtn');
        const sidebar = document.getElementById('sidebar');
        const placeholderText = document.getElementById('placeholderText');

        menuBtn.addEventListener('click', function() {
            sidebar.classList.toggle('open');
            menuBtn.innerHTML = sidebar.classList.contains('open') ? "✕" : "☰";
        });

        document.querySelector('.content').addEventListener('click', function(e) {
            if (sidebar.classList.contains('open') && e.target !== menuBtn) {
                sidebar.classList.remove('open');
                menuBtn.innerHTML = "☰";
            }
        });

        document.addEventListener("DOMContentLoaded", fetchDataAndRender);

        function fetchDataAndRender() {
            const url = "https://script.google.com/macros/s/AKfycbzU2-uP0jUUia8w74BBQ7U78OUn3d_SE7cEd_LBZJbq2b2g4HCJyFRAOLKMU9p2zb0F/exec";
            const payload = { "sheet": "Home", "action": "get" };

            fetch(url, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                document.getElementById('loading').style.display = 'none';
                if (data.status === "success" && data.all_data && data.all_data.Home) {
                    renderList(data.all_data.Home);
                }
            })
            .catch(err => {
                document.getElementById('loading').innerText = "Lỗi kết nối!";
            });
        }

        function renderList(rows) {
            const listContainer = document.getElementById('webList');
            for (let i = 1; i < rows.length; i++) {
                const tenWeb = rows[i].A;
                const urlWeb = rows[i].B;
                if (!tenWeb) continue; 

                const listItem = document.createElement('li');
                listItem.innerText = tenWeb;
                listItem.addEventListener('click', function() {
                    listContainer.querySelectorAll('li').forEach(item => item.classList.remove('active'));
                    this.classList.add('active');
                    sidebar.classList.remove('open');
                    menuBtn.innerHTML = "☰";
                    placeholderText.style.display = 'none';
                    loadWeb(tenWeb, urlWeb);
                });
                listContainer.appendChild(listItem);
            }
        }

        function loadWeb(name, url) {
            const iframe = document.getElementById('webFrame');
            document.title = name; // Vẫn cập nhật title trang web
            if (url && (url.startsWith('http://') || url.startsWith('https://'))) {
                iframe.src = url;
            } else {
                iframe.src = "about:blank"; 
                placeholderText.style.display = 'block';
                placeholderText.innerText = `Lỗi: URL không hợp lệ.`;
            }
        }
    </script>
</body>
</html>
